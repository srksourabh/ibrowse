name: Bug report
description: Something did not work, or sounded wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. This form works with a screen reader. If anything here is hard to use, please say so.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: If iBrowse said something wrong, write the exact words you heard.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A public page address helps most. Do not paste private pages or passwords.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: iBrowse version
      placeholder: "0.1.0"
  - type: input
    id: browser
    attributes:
      label: Chrome version and operating system
      placeholder: "Chrome 130, Windows 11"
  - type: dropdown
    id: input
    attributes:
      label: How were you exploring?
      multiple: true
      options: [Mouse, Touchscreen, Keyboard, Gamepad, Haptic device]
  - type: dropdown
    id: voice
    attributes:
      label: Which voice?
      options: [Browser voice, Screen reader (Companion mode), Google Gemini voice, Not sure]
  - type: input
    id: reader
    attributes:
      label: Screen reader, if any
      placeholder: "NVDA 2025.3"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
