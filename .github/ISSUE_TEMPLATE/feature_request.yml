name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
      description: Describe the problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: If it involves speech, write what you would want to hear.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: checkboxes
    id: constraints
    attributes:
      label: Check what applies
      options:
        - label: It must work without sight
        - label: It must work without sending data anywhere
        - label: I would help test it
