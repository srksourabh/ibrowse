<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iBrowse hardware setup</title>
    <style>
      :root { color-scheme: light dark; --gutter: 16px; }
      body { font: 1.125rem/1.6 system-ui, sans-serif; margin: 0; }
      main { max-width: 40rem; margin: 0 auto; padding: var(--gutter); }
      button, select, textarea { font: inherit; padding: 0.5rem 0.75rem; margin: 0.25rem 0; }
      button { display: block; min-width: 16rem; text-align: left; }
      textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      #status { min-height: 3rem; padding: 0.75rem; border: 2px solid currentColor; border-radius: 4px; }
      :focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>iBrowse hardware setup</h1>
      <p id="intro">
        Choose how iBrowse gives touch feedback. Sound is always on; these options add feeling.
        Use Tab to move between the options and Enter to choose one.
      </p>

      <h2>Feedback</h2>
      <button id="choose-none" type="button">Sound only</button>
      <button id="choose-simulator" type="button">Sound simulator</button>
      <button id="choose-gamepad" type="button">Game controller</button>

      <h2>Paired haptic device</h2>
      <label for="profile">Device profile</label>
      <select id="profile"></select>
      <button id="pair" type="button">Pair a device</button>

      <label for="profile-json">Import a device profile (JSON)</label>
      <textarea id="profile-json" rows="8" spellcheck="false"></textarea>
      <button id="import" type="button">Import profile</button>

      <h2>Try it</h2>
      <button id="test" type="button">Play test pattern</button>

      <h2>Status</h2>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
